<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="orangeGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff9933" />
      <stop offset="70%" stop-color="#ea7a1e" />
      <stop offset="100%" stop-color="#c95a08" />
    </radialGradient>
    
    <radialGradient id="tealGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e6b82" />
      <stop offset="85%" stop-color="#084757" />
      <stop offset="100%" stop-color="#042c36" />
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce38a" />
      <stop offset="50%" stop-color="#e5a93b" />
      <stop offset="100%" stop-color="#b37618" />
    </linearGradient>

    <!-- Text Paths for Curving Text around Ring -->
    <path id="topTextArc" d="M 80 250 A 170 170 0 1 1 420 250" fill="none" />
    <path id="bottomTextArc" d="M 420 250 A 170 170 0 0 1 80 250" fill="none" />
    
    <!-- Filter for 3D Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25" />
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#04252e" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Drop Shadow Circle -->
  <circle cx="250" cy="250" r="236" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Outer Gold Rim -->
  <circle cx="250" cy="250" r="234" fill="url(#goldRim)" />
  <circle cx="250" cy="250" r="226" fill="#063e4c" />

  <!-- Outer Ring with Text (Navy/Teal) -->
  <circle cx="250" cy="250" r="222" fill="url(#tealGrad)" stroke="#e5a93b" stroke-width="2" />

  <!-- Inner Gold Dividing Ring -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#goldRim)" stroke-width="3" />
  
  <!-- Stitched Dotted Line on Rim -->
  <circle cx="250" cy="250" r="158" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6" />

  <!-- Top Curved Text -->
  <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="3.2">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      CUSTOMIZE UNIFORMS • HOODIES • SHIRTS • T-SHIRTS • B2B
    </textPath>
  </text>

  <!-- Left & Right Gold Stars -->
  <g fill="#e5a93b">
    <polygon points="62,250 67,240 78,240 70,247 73,258 62,251 52,258 55,247 47,240 58,240" />
    <polygon points="438,250 443,240 454,240 446,247 449,258 438,251 428,258 431,247 423,240 434,240" />
  </g>

  <!-- Bottom Curved Text -->
  <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="800" fill="#fce38a" letter-spacing="3.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      PRECISION STITCHING &amp; CORPORATE APPAREL
    </textPath>
  </text>

  <!-- Inner Disc (Warm Radiant Orange Gradient) -->
  <circle cx="250" cy="250" r="152" fill="url(#orangeGrad)" />
  
  <!-- Sunburst Ray Patterns in Disc -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.15">
    <line x1="250" y1="98" x2="250" y2="402" />
    <line x1="98" y1="250" x2="402" y2="250" />
    <line x1="142" y1="142" x2="358" y2="358" />
    <line x1="142" y1="358" x2="358" y2="142" />
    <line x1="110" y1="190" x2="390" y2="310" />
    <line x1="110" y1="310" x2="390" y2="190" />
    <line x1="190" y1="110" x2="310" y2="390" />
    <line x1="310" y1="110" x2="190" y2="390" />
  </g>

  <!-- Needle & Scissors Tailoring Art on Orange Center -->
  <g transform="translate(250, 160)" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.95">
    <!-- Tailor Scissors Motif -->
    <path d="M -16 -20 C -26 -28 -34 -14 -22 -6 C -12 0 -2 8 0 16" stroke="#ffffff" stroke-width="3" />
    <path d="M 16 -20 C 26 -28 34 -14 22 -6 C 12 0 2 8 0 16" stroke="#ffffff" stroke-width="3" />
    <circle cx="-25" cy="-18" r="7" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="25" cy="-18" r="7" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="0" cy="8" r="2.5" fill="#ffffff" />
    <line x1="-12" y1="26" x2="12" y2="26" stroke="#e5a93b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Calligraphy Script: Fine Stitch -->
  <text x="250" y="248" 
        font-family="'Brush Script MT', 'Lucida Calligraphy', 'Segoe Script', cursive, sans-serif" 
        font-size="64" 
        font-weight="bold" 
        font-style="italic"
        text-anchor="middle" 
        fill="#ffffff" 
        filter="url(#textShadow)"
        letter-spacing="1">
    Fine Stitch
  </text>

  <!-- Lower Curved Ribbon / Arc for UNIFORMS -->
  <path d="M 165 288 Q 250 312 335 288" fill="none" stroke="#063e4c" stroke-width="30" stroke-linecap="round" />
  <path d="M 165 288 Q 250 312 335 288" fill="none" stroke="#e5a93b" stroke-width="34" stroke-linecap="round" opacity="0.4" />
  <path d="M 165 288 Q 250 312 335 288" fill="none" stroke="#084757" stroke-width="28" stroke-linecap="round" />

  <text x="250" y="296" 
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" 
        font-weight="900" 
        text-anchor="middle" 
        fill="#ffffff" 
        letter-spacing="5">
    UNIFORMS
  </text>

  <!-- Small Established Tag Below -->
  <text x="250" y="340" 
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="11" 
        font-weight="800" 
        text-anchor="middle" 
        fill="#ffffff" 
        letter-spacing="2"
        opacity="0.95">
    ★ MUMBAI • EST. 2010 ★
  </text>
</svg>

